<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Stop Timings</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; padding-bottom: 50px; margin: 0; }
        .container { width: 95%; max-width: 900px; margin: auto; }
        h1 { margin-top: 20px; color: #2c3e50; }
        
        .bus-buttons button {
            margin: 8px; padding: 12px 20px; font-size: 16px; border: none;
            border-radius: 6px; background-color: #2c3e50; color: white;
            cursor: pointer; transition: 0.3s;
        }
        .bus-buttons button:hover { background-color: #1abc9c; }

        .controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        #searchInput { display: none; padding: 10px; width: 60%; max-width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        #downloadPdfBtn { display: none; padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #downloadPdfBtn:hover { background-color: #219150; }

        .bus-section { display: none; margin: 25px 0; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); overflow-x: auto;}
        h2 { background-color: #2c3e50; color: white; padding: 10px; border-radius: 8px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #333; }
        th:first-child, td:first-child { width: 50px; text-align: center; }
        
        tbody tr { transition: background-color 0.2s; cursor: pointer; }
        tbody tr:hover { background-color: #e8f4f8; }
        
        /* NEW: Styling for the row while it is being dragged */
        .sortable-ghost { opacity: 0.4; background-color: #f1c40f; }

        #warning { color: red; font-weight: bold; }
        .footer { position: fixed; bottom: 0; width: 100%; padding: 10px; background-color: #2c3e50; color: white; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-box {
            background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 15px;
        }
        .modal-box h3 { margin: 0 0 10px 0; color: #2c3e50; }
        .modal-box select, .modal-box input { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; }
        
        .btn-action { padding: 12px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-add { background-color: #3498db; } .btn-add:hover { background-color: #2980b9; }
        .btn-edit { background-color: #f39c12; } .btn-edit:hover { background-color: #d68910; }
        .btn-delete { background-color: #e74c3c; } .btn-delete:hover { background-color: #c0392b; }
        .btn-cancel { background-color: #7f8c8d; } .btn-cancel:hover { background-color: #95a5a6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bus Stop Timings</h1>
        <p id="warning">Timings effective from 01/04/2026</p>

        <div class="bus-buttons">
            <button onclick="loadBus('senior1')">HR47D 2512</button>
            <button onclick="loadBus('senior2')">HR37E 2772</button>
            <button onclick="loadBus('junior')">HR55AD 5177</button>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search stop or name..." onkeyup="filterTable()">
            <button id="downloadPdfBtn" onclick="downloadPDF()">Download PDF List</button>
        </div>

        <div id="activeBusSection" class="bus-section">
            <h2 id="busTitle">Loading...</h2>
            <table>
                <thead>
                    <tr><th>S.No</th><th>Bus Stop</th><th>Name</th><th>Time</th></tr>
                </thead>
                <tbody id="busTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="actionModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="actionModalTitle">Student Options</h3>
            <button class="btn-action btn-edit" onclick="openEditModal()">Edit Student</button>
            <button class="btn-action btn-add" onclick="openAddModal()">Add Student Below</button>
            <button class="btn-action btn-delete" onclick="executeDelete()">Delete Student</button>
            <button class="btn-action btn-cancel" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <div id="formModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="formModalTitle">Add Student</h3>
            <select id="stopDropdown" onchange="checkCustomStop()"></select>
            <input type="text" id="customStop" placeholder="Type new stop name..." style="display:none;">
            <input type="text" id="studentName" placeholder="Student Name">
            <input type="time" id="studentTime">
            <button class="btn-action btn-add" id="saveBtn" onclick="executeSave()">Save Student</button>
            <button class="btn-action btn-cancel" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <div class="footer">&copy; 2026 Bus Timings</div>

    <script>
        // --- PASTE YOUR WEB APP URL BELOW ---
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzbl90xZu2eczNYVqzRah7bHJh7iaHkkyGwzE_Z98qvp3xe5mymbu8wdNKaVWvvtXQ/exec"; 
        
        const busTitles = {
            'senior1': 'HR39C 5612 (Senior Market)',
            'senior2': 'HR37E 2772 (Senior Outskirts)',
            'junior': 'HR55X 9051 (Junior)'
        };

        let currentBusId = null;
        let allBusData = {}; 
        let targetStop = "";
        let targetName = "";
        let targetTime = "";
        let isEditing = false; 
        let sortableInstance = null; // Stores the drag-and-drop tool

        async function fetchBusData() {
            try {
                const response = await fetch(scriptUrl);
                const data = await response.json();
                allBusData = parseSheetData(data.values);
                return allBusData;
            } catch (error) {
                alert("Error connecting to database.");
                return {};
            }
        }

        function parseSheetData(values) {
            if (!values) return {};
            const busData = {};
            values.slice(1).forEach(row => {
                const [bus, stop, name, time] = row;
                if (!busData[bus]) busData[bus] = [];
                busData[bus].push({ stop, name, time });
            });
            return busData;
        }

        async function loadBus(busId) {
            currentBusId = busId;
            document.getElementById("activeBusSection").style.display = "block";
            document.getElementById("busTitle").innerText = busTitles[busId] + " - Loading...";
            
            await fetchBusData(); 
            document.getElementById("busTitle").innerText = busTitles[busId];
            renderTable(); 
            
            document.getElementById("searchInput").style.display = "inline-block";
            document.getElementById("downloadPdfBtn").style.display = "inline-block";
        }

        function renderTable() {
            const tbody = document.getElementById("busTableBody");
            tbody.innerHTML = "";

            if (allBusData[currentBusId] && allBusData[currentBusId].length > 0) {
                allBusData[currentBusId].forEach((item, index) => {
                    const tr = document.createElement("tr");
                    tr.onclick = () => openActionModal(item.stop, item.name, item.time);
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.stop}</td>
                        <td>${item.name}</td>
                        <td>${item.time}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr class="no-drag" onclick="openAddModal(true)"><td colspan="4" style="text-align:center; color:blue;">No students found. Click here to add the first one!</td></tr>`;
            }
            filterTable(); 
            initSortable(); // Re-bind the drag tool every time the table is drawn
        }

        // --- NEW: DRAG AND DROP / LONG PRESS LOGIC ---
        function initSortable() {
            const tbody = document.getElementById("busTableBody");
            if (sortableInstance) sortableInstance.destroy(); // Clear old tool

            sortableInstance = new Sortable(tbody, {
                animation: 150,
                delay: 200, // Requires 200ms hold on mobile before dragging starts
                delayOnTouchOnly: true, // Desktop remains instant click-and-drag
                filter: ".no-drag", // Prevents dragging the "No students found" message
                onEnd: async function (evt) {
                    if (evt.oldIndex === evt.newIndex) return; // Didn't actually move

                    // 1. Move the data locally
                    const movedItem = allBusData[currentBusId].splice(evt.oldIndex, 1)[0];
                    allBusData[currentBusId].splice(evt.newIndex, 0, movedItem);

                    // 2. Visually redraw the table to fix the Serial Numbers
                    renderTable(); 

                    // 3. Save to Google Sheet
                    document.getElementById("busTitle").innerText = busTitles[currentBusId] + " - Saving order...";
                    const formData = new URLSearchParams();
                    formData.append("action", "reorder");
                    formData.append("bus", currentBusId);
                    formData.append("newOrder", JSON.stringify(allBusData[currentBusId]));

                    await fetch(scriptUrl, { method: "POST", body: formData });
                    document.getElementById("busTitle").innerText = busTitles[currentBusId];
                }
            });
        }

        // --- MODAL CONTROLS ---
        function openActionModal(stop, name, time) {
            targetStop = stop;
            targetName = name;
            targetTime = time; 
            document.getElementById("actionModalTitle").innerText = `Options for ${name}`;
            document.getElementById("actionModal").style.display = "flex";
        }

        function closeModals() {
            document.getElementById("actionModal").style.display = "none";
            document.getElementById("formModal").style.display = "none";
            document.getElementById("studentName").value = "";
            document.getElementById("customStop").style.display = "none";
            document.getElementById("customStop").value = "";
        }

        function populateDropdown() {
            const dropdown = document.getElementById("stopDropdown");
            dropdown.innerHTML = "";
            if (allBusData[currentBusId]) {
                const uniqueStops = [...new Set(allBusData[currentBusId].map(item => item.stop))];
                uniqueStops.forEach(stop => {
                    dropdown.innerHTML += `<option value="${stop}">${stop}</option>`;
                });
            }
            dropdown.innerHTML += `<option value="NEW_STOP">-- Add New Stop --</option>`;
            return dropdown;
        }

        function checkCustomStop() {
            const dropdown = document.getElementById("stopDropdown");
            const customInput = document.getElementById("customStop");
            customInput.style.display = dropdown.value === "NEW_STOP" ? "block" : "none";
        }

        function openAddModal(isFirstStudent = false) {
            isEditing = false;
            document.getElementById("actionModal").style.display = "none";
            document.getElementById("formModalTitle").innerText = "Add Student Below";
            document.getElementById("saveBtn").innerText = "Save Student";
            document.getElementById("saveBtn").className = "btn-action btn-add";
            
            const dropdown = populateDropdown();
            
            if(isFirstStudent) { 
                targetStop = ""; targetName = ""; 
            } else if (targetStop) {
                dropdown.value = targetStop; 
            }

            document.getElementById("studentTime").value = "07:00"; 
            checkCustomStop(); 
            document.getElementById("formModal").style.display = "flex";
        }

        function openEditModal() {
            isEditing = true;
            document.getElementById("actionModal").style.display = "none";
            document.getElementById("formModalTitle").innerText = "Edit Student";
            document.getElementById("saveBtn").innerText = "Update Student";
            document.getElementById("saveBtn").className = "btn-action btn-edit";

            const dropdown = populateDropdown();
            dropdown.value = targetStop;
            
            document.getElementById("studentName").value = targetName;
            document.getElementById("studentTime").value = format24HourTime(targetTime); 
            
            checkCustomStop();
            document.getElementById("formModal").style.display = "flex";
        }

        function format12HourTime(time24) {
            if (!time24) return "";
            let [hours, minutes] = time24.split(':');
            hours = parseInt(hours, 10);
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            return `${hours}:${minutes} ${ampm}`;
        }

        function format24HourTime(time12) {
            if (!time12) return "07:00";
            const match = time12.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!match) return "07:00";
            let [ , hours, minutes, modifier] = match;
            hours = parseInt(hours, 10);
            if (hours === 12) hours = modifier.toUpperCase() === 'AM' ? 0 : 12;
            else if (modifier.toUpperCase() === 'PM') hours += 12;
            return `${hours.toString().padStart(2, '0')}:${minutes}`;
        }

        async function executeSave() {
            const dropdown = document.getElementById("stopDropdown");
            let finalStop = dropdown.value === "NEW_STOP" ? document.getElementById("customStop").value.trim() : dropdown.value;
            const name = document.getElementById("studentName").value.trim();
            const rawTime = document.getElementById("studentTime").value; 
            
            if (!finalStop || !name || !rawTime) return alert("Please fill in Stop, Name, and Time.");

            const formattedTime = format12HourTime(rawTime);
            document.getElementById("saveBtn").innerText = "Saving...";

            const formData = new URLSearchParams();
            formData.append("action", isEditing ? "edit" : "add");
            formData.append("bus", currentBusId);
            formData.append("targetStop", targetStop); 
            formData.append("targetName", targetName); 
            formData.append("stop", finalStop);
            formData.append("name", name);
            formData.append("time", formattedTime);

            await fetch(scriptUrl, { method: "POST", body: formData });
            
            if (!allBusData[currentBusId]) allBusData[currentBusId] = [];
            const indexToUpdate = allBusData[currentBusId].findIndex(item => item.stop === targetStop && item.name === targetName);
            const updatedStudent = { stop: finalStop, name: name, time: formattedTime };

            if (isEditing) {
                if (indexToUpdate !== -1) allBusData[currentBusId][indexToUpdate] = updatedStudent;
            } else {
                if (indexToUpdate !== -1) {
                    allBusData[currentBusId].splice(indexToUpdate + 1, 0, updatedStudent); 
                } else {
                    allBusData[currentBusId].push(updatedStudent); 
                }
            }

            closeModals();
            renderTable(); 
        }

        async function executeDelete() {
            if (!confirm(`Are you sure you want to permanently delete ${targetName}?`)) return;
            document.querySelector(".btn-delete").innerText = "Deleting...";

            const formData = new URLSearchParams();
            formData.append("action", "delete");
            formData.append("bus", currentBusId);
            formData.append("targetStop", targetStop);
            formData.append("targetName", targetName);

            await fetch(scriptUrl, { method: "POST", body: formData });
            
            const deleteIndex = allBusData[currentBusId].findIndex(item => item.stop === targetStop && item.name === targetName);
            if (deleteIndex !== -1) allBusData[currentBusId].splice(deleteIndex, 1); 
            
            document.querySelector(".btn-delete").innerText = "Delete Student";
            closeModals();
            renderTable(); 
        }

        function filterTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.querySelectorAll("#busTableBody tr");
            let visibleCount = 1;
            rows.forEach(row => {
                if (row.innerText.toLowerCase().includes(input)) {
                    row.style.display = "";
                    row.cells[0].innerText = visibleCount++; 
                } else {
                    row.style.display = "none";
                }
            });
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const busTitle = document.getElementById("busTitle").innerText;
            const rows = [];

            document.querySelectorAll("#busTableBody tr").forEach(row => {
                if (row.style.display !== "none" && row.cells.length > 1) {
                    rows.push([row.cells[0].innerText, row.cells[1].innerText, row.cells[2].innerText, row.cells[3].innerText]);
                }
            });

            doc.setFontSize(18); doc.text("Bus Stop Timings", 14, 20);
            doc.setFontSize(12); doc.text(`Route: ${busTitle}`, 14, 30);
            doc.text("Effective: 01/04/2026", 14, 37);

            doc.autoTable({
                startY: 45, head: [['S.No', 'Bus Stop', 'Name', 'Time']], body: rows, 
                theme: 'striped', headStyles: { fillColor: [44, 62, 80] },
                styles: { fontSize: 10, cellPadding: 3 }, columnStyles: { 0: { halign: 'center' } }
            });

            doc.save(`${busTitle.replace(/\s+/g, '_')}.pdf`);
        }
    </script>
</body>
</html>
